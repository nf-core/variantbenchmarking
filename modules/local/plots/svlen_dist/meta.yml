name: "plots_svlen_dist"
description: "Parses VCF or CSV files to extract variant lengths and generates a distribution plot (PNG)."
keywords:
  - plot
  - vcf
  - csv
  - svlen
  - structural variants
  - indel
  - python
  - pandas
  - plotly
tools:
  - python:
      description: "Python programming language"
      homepage: "https://www.python.org"
      licence: ["Python-2.0"]
      description: "pandas is a fast, powerful, flexible and easy to use open source data analysis and manipulation tool."
      homepage: "https://pandas.pydata.org/"
      licence: ["BSD-3-Clause"]
  - plotly:
      description: "An interactive, open-source plotting library for Python."
      homepage: "https://plotly.com/python/"
      licence: ["MIT"]
  - numpy:
      description: "The fundamental package for scientific computing with Python"
      homepage: "https://numpy.org/"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information.
          Must contain `id` and `tag`.
          e.g. `[ id:'test', tag:'manta' ]`
    - input:
        type: file
        description: Input VCF or CSV file containing variant length information.
        pattern: "*.{vcf,vcf.gz,csv}"

output:
  plots:
    - meta:
        type: map
        description: Groovy Map containing sample information.
    - html:
        type: file
        description: Interactive HTML reports visualizing benchmarking results.
        pattern: "*.html"

  versions_python:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750"

authors:
  - "Victor Perez"
maintainers:
  - "Victor Perez"
