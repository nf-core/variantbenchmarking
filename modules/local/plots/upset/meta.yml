name: "plots_upset"
description: "Generates UpSet plots to visualize the intersection of variant calls (FP, FN, TP) across different tools."
keywords:
  - plot
  - upset
  - benchmarking
  - intersection
  - variants
  - python
  - pandas
  - plotly
tools:
  - python:
      description: "Python programming language"
      homepage: "https://www.python.org"
      licence: ["Python-2.0"]
  - upsetplot:
      description: "A Python implementation of UpSet plots for visualizing intersecting sets."
      homepage: "https://upsetplot.readthedocs.io/"
      licence: ["BSD-3-Clause"]
  - pandas:
      description: "Data manipulation and analysis library for Python"
      homepage: "https://pandas.pydata.org/"
      licence: ["BSD-3-Clause"]
  - plotly:
      description: "An interactive, open-source plotting library for Python."
      homepage: "https://plotly.com/python/"
      licence: ["MIT"]
      
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information.
          Must contain `id` which matches the prefixes of the input files.
          e.g. `[ id:'test' ]`
    - files:
        type: list
        description: A list of CSV files (FP, FN, TP_base, TP_comp) generated by benchmarking tools.
        pattern: "*.csv"

output:
  plots:
    - meta:
        type: map
        description: Groovy Map containing sample information.
    - html:
        type: file
        description: Interactive HTML reports visualizing benchmarking results.
        pattern: "*.html"
  versions_python:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750"

authors:
  - "@kubranarci"
maintainers:
  - "@kubranarci"
