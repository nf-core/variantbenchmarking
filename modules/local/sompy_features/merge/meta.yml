name: "sompy_features_merge"
description: "Merges multiple Sompy feature CSV files based on CHROM and POS coordinates."
keywords:
  - sompy
  - benchmark
  - merge
  - csv
  - python
  - pandas
tools:
  - python:
      description: "Python programming language"
      homepage: "https://www.python.org"
      licence: ["Python-2.0"]
  - pandas:
      description: "Data manipulation and analysis library for Python"
      homepage: "https://pandas.pydata.org/"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information.
          Must contain `id` which matches the prefixes of the input files.
          e.g. `[ id:'test' ]`
    - csvs:
        type: list
        description: A list of CSV files generated by Sompy containing GT columns.
        pattern: "*.csv"

output:
  output:
      - meta:
          type: map
          description: Groovy Map containing sample information.
      - csv:
          type: file
          description: Merged CSV file containing all GT columns.
          pattern: "*.csv"
  versions_python:
      - versions:
          type: tuple
          description: Tuple containing process name, software name, and version string.

topics:
  versions:
    - versions:
        type: tuple
        description: Tuple containing process name, software name, and version string.

authors:
  - "@kubranarci"
maintainers:
  - "@kubranarci"