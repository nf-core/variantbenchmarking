report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/variantbenchmarking/tree/dev" target="_blank">nf-core/variantbenchmarking</a> analysis pipeline. For information about how to interpret these results, please see the <a href="https://nf-co.re/variantbenchmarking/dev/docs/output" target="_blank">documentation</a>.

report_section_order:
  "nf-core-variantbenchmarking-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-variantbenchmarking-summary":
    order: -1002

export_plots: true
disable_version_detection: true
ignore_images: false

fn_clean_trim:
  - ".chr21"
  - ".sort"
  - ".subsample"
  - ".reheader"
  - ".filtercontigs"
  - ".filter"
  - ".norm"
  - ".filtermissing"
  - ".vcf"
  - ".gz"

# Customize General Statistics table
table_columns_visible:
  bcftools:
    number_of_MNPs: true
    number_of_others: true

# Run only these modules
run_modules:
  - bcftools
  - truvari
  - happy
  - sompy
  - custom_content

custom_data:
  survivor:
    id: "survivor"
    section_name: "SURVIVOR variant statistics"
    description: "generated by nf-core/survivor"
    plot_type: "bargraph"
    format: "tsv"
    pconfig:
      id: "survivor"
      namespace: "SURVIVOR variant statistics"
      table_title: "Variant statistics from survivor stats tool"
      ylab: "Count"

  summary_reports_1:
    id: "summary_reports_1"
    section_name: "Variant metrics"
    plot_type: "html"
    format: "html"

  summary_reports_2:
    id: "summary_reports_2"
    section_name: "FP INDEL/SV length distributions"
    plot_type: "html"
    format: "html"

  summary_reports_3:
    id: "summary_reports_3"
    section_name: "FN INDEL/SV length distributions"
    plot_type: "html"
    format: "html"

  summary_reports_4:
    id: "summary_reports_4"
    section_name: "TP comp INDEL/SV length distributions"
    plot_type: "html"
    format: "html"

  summary_reports_5:
    id: "summary_reports_5"
    section_name: "TP base INDEL/SV length distributions"
    plot_type: "html"
    format: "html"

  summary_reports_6:
    id: "summary_reports_6"
    section_name: "Upset plot for TP vs FN"
    plot_type: "html"
    format: "html"

  summary_reports_7:
    id: "summary_reports_7"
    section_name: "Upset plot for TP vs FP"
    plot_type: "html"
    format: "html"

  # Individual summary table definitions for each tool
  variant_calling_summary_svbenchmark: &summary_table_template
    file_format: "csv"
    section_name: "Variant Calling Summary - SVBenchmark"
    description: "Comparison of variant calling results across different tools"
    plot_type: "table"
    pconfig:
      id: "variant_calling_summary_svbenchmark"
      title: "Variant Calling Performance Metrics (SVBenchmark)"
      scale: false
      col1_header: "Tool"
      print_table: false
    headers: &summary_headers
      File: { title: "File", description: "Summary file name", scale: false }
      Caller: { title: "Caller", description: "Variant calling tool", scale: false }
      TP_base: { title: "TP (base)", description: "True positives in baseline", format: "{:,.0f}" }
      TP_comp: { title: "TP (comp)", description: "True positives in comparison", format: "{:,.0f}" }
      FP: { title: "FP", description: "False positives", format: "{:,.0f}" }
      FN: { title: "FN", description: "False negatives", format: "{:,.0f}" }
      Precision: { title: "Precision", description: "Precision metric", format: "{:,.4f}", max: 1.0, min: 0.0 }
      Recall: { title: "Recall", description: "Recall metric", format: "{:,.4f}", max: 1.0, min: 0.0 }
      F1: { title: "F1 Score", description: "F1 score metric", format: "{:,.4f}", max: 1.0, min: 0.0 }

  variant_calling_summary_truvari:
    <<: *summary_table_template
    section_name: "Variant Calling Summary - Truvari"
    pconfig:
      id: "variant_calling_summary_truvari"
      title: "Variant Calling Performance Metrics (Truvari)"
      scale: false
      col1_header: "Tool"
    headers: *summary_headers

  variant_calling_summary_wittyer:
    <<: *summary_table_template
    section_name: "Variant Calling Summary - Wittyer"
    pconfig:
      id: "variant_calling_summary_wittyer"
      title: "Variant Calling Performance Metrics (Wittyer)"
      scale: false
      col1_header: "Tool"
    headers: *summary_headers

  variant_calling_summary_rtgtools:
    <<: *summary_table_template
    section_name: "Variant Calling Summary - RTG Tools"
    pconfig:
      id: "variant_calling_summary_rtgtools"
      title: "Variant Calling Performance Metrics (RTG Tools)"
      scale: false
      col1_header: "Tool"
    headers: *summary_headers

  variant_calling_summary_aardvark:
    <<: *summary_table_template
    section_name: "Variant Calling Summary - Aardvark"
    pconfig:
      id: "variant_calling_summary_aardvark"
      title: "Variant Calling Performance Metrics (Aardvark)"
      scale: false
      col1_header: "Tool"
    headers: *summary_headers

  variant_calling_summary_concordance:
    <<: *summary_table_template
    section_name: "Variant Calling Summary - Concordance"
    pconfig:
      id: "variant_calling_summary_concordance"
      title: "Variant Calling Performance Metrics (Concordance)"
      scale: false
      col1_header: "Tool"
    headers: *summary_headers

  variant_calling_summary_intersect:
    <<: *summary_table_template
    section_name: "Variant Calling Summary - Intersect"
    pconfig:
      id: "variant_calling_summary_intersect"
      title: "Variant Calling Performance Metrics (Intersect)"
      scale: false
      col1_header: "Tool"
    headers: *summary_headers

sp:
  survivor:
    fn: "*.stats"
  bcftools/stats:
    contents: This file was produced by bcftools stats
  truvari/bench:
    contents_re: .*truvari.* bench.*
    fn: "*log.txt"
    num_lines: 10
  happy:
    contents: Type,Filter,TRUTH
    fn: "*.summary.csv"
  sompy:
    contents: ",sompyversion,sompycmd"
    fn: "*.stats.csv"
    num_lines: 2
  summary_reports_1:
    fn: "*_mqc.html"
  summary_reports_2:
    fn: "*FP.*_mqc.html"
  summary_reports_3:
    fn: "*FN.*_mqc.html"
  summary_reports_4:
    fn: "*TP_comp.*_mqc.html"
  summary_reports_5:
    fn: "*TP_base.*_mqc.html"
  summary_reports_6:
    fn: "*tp_fn_mqc.html"
  summary_reports_7:
    fn: "*tp_fp_mqc.html"
  variant_calling_summary_svbenchmark:
    fn: "*svbenchmark*.summary.csv"
    contents: "Tool,File,Caller"
  variant_calling_summary_truvari:
    fn: "*truvari*.summary.csv"
    contents: "Tool,File,Caller"
  variant_calling_summary_wittyer:
    fn: "*wittyer*.summary.csv"
    contents: "Tool,File,Caller"
  variant_calling_summary_rtgtools:
    fn: "*rtgtools*.summary.csv"
    contents: "Tool,File,Caller"
  variant_calling_summary_aardvark:
    fn: "*aardvark*.summary.csv"
    contents: "Tool,File,Caller"
  variant_calling_summary_concordance:
    fn: "*concordance*.summary.csv"
    contents: "Tool,File,Caller"
  variant_calling_summary_intersect:
    fn: "*intersect*.summary.csv"
    contents: "Tool,File,Caller"

module_order:
  - bcftools:
      name: "Input SNV/INDEL/DELETION statistics"
  - survivor:
      name: "Input INDEL/DELETION statistics"
  - happy:
      name: "hap.py summary statistics"
  - sompy:
      name: "som.py summary statistics"
  - truvari/bench:
      name: "Truvari summary statistics"
  - variant_calling_summary_svbenchmark
  - variant_calling_summary_truvari
  - variant_calling_summary_wittyer
  - variant_calling_summary_rtgtools
  - variant_calling_summary_aardvark
  - variant_calling_summary_concordance
  - variant_calling_summary_intersect
  - summary_reports_1
  - summary_reports_2
  - summary_reports_3
  - summary_reports_4
  - summary_reports_5
  - summary_reports_6
  - summary_reports_7
