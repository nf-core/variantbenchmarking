name: "happy_benchmark"
description: "Subworkflow for benchmarking variant calls against a truth set using Illumina's hap.py"
keywords:
  - benchmark
  - happy
  - variants
  - vcf
  - validation
components:
  - happy/happy
  - happy/prepy
  - bcftools/reheader
  - bcftools/view
  - bcftools/filter
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information.
    - test_vcf:
        type: file
        description: Query VCF file to be benchmarked.
        pattern: "*.{vcf.gz}"
    - test_index:
        type: file
        description: Index for the Query VCF.
        pattern: "*.{tbi,csi}"
    - truth_vcf:
        type: file
        description: Truth VCF file to benchmark against.
        pattern: "*.{vcf.gz}"
    - truth_index:
        type: file
        description: Index for the Truth VCF.
        pattern: "*.{tbi,csi}"
    - regionsbed:
        type: file
        description: Optional BED file containing regions to restrict the analysis to.
    - targetsbed:
        type: file
        description: Optional BED file containing target regions.
  - - meta:
        type: map
        description: Groovy Map containing reference information.
    - fasta:
        type: file
        description: Reference genome FASTA file.
        pattern: "*.{fa,fasta}"
  - - meta:
        type: map
        description: Groovy Map containing reference information.
    - fai:
        type: file
        description: Reference genome FASTA index file.
        pattern: "*.fai"
  - - meta:
        type: map
        description: Groovy Map containing bed information
    - falsepositive_bed:
        type: file
        description: Optional BED file of false positive regions.
  - - meta:
        type: map
        description: Groovy Map containing bed information
    - stratification_bed:
        type: file
        description: Optional BED files for stratification.
  - - meta:
        type: map
        description: Groovy Map containing TSV information
    - stratification_tsv:
        type: file
        description: TSV file listing stratification regions.
output:
  summary_reports:
    - meta:
        type: map
        description: Groovy Map containing report information.
    - reports:
        type: file
        description: Summary reports (CSV) generated by Happy.
        pattern: "*.csv"
  tagged_variants:
    - meta:
        type: map
        description: Groovy Map containing variant tag information (TP_comp, TP_base, FP, FN).
    - vcfs:
        type: file
        description: Filtered and reheaded VCF files containing specific variant classifications.
        pattern: "*.vcf.gz"
authors:
  - "@kubranarci"
maintainers:
  - "@kubranarci"
