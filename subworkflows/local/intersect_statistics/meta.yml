name: "intersect_statistics"
description: "Subworkflow to convert VCFs to BED format and calculate intersection statistics against truth regions."
keywords:
  - bedtools
  - intersect
  - benchmark
  - svtk
  - bedops
components:
  - local/custom/bedtools_intersect_bench
  - svtk/vcf2bed
  - bedops/convert2bed
  - tabix/bgzip
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information.
    - vcf:
        type: file
        description: Input VCF file (optional if providing regions directly).
        pattern: "*.{vcf.gz,vcf}"
    - regions:
        type: file
        description: Either the VCF index file (.tbi) or a direct BED regions file.
        pattern: "*.{tbi,bed}"
  - - truth_regions:
        type: file
        description: Truth BED file to intersect against.
        pattern: "*.bed"
output:
  summary_reports:
    - meta:
        type: map
        description: Groovy Map containing report metadata (vartype and benchmark_tool).
    - reports:
        type: file
        description: Summary reports generated by the intersection analysis.
        pattern: "*.{csv,tsv,txt}"
authors:
  - "@kubranarci"
maintainers:
  - "@kubranarci"
